# =============================================================================
#  nginx.conf — configuración del servidor del frontend
# =============================================================================
#  Este fichero resuelve DOS problemas típicos de servir una SPA con nginx:
#
#  1. SPA ROUTING: Angular maneja las rutas (/proyectos, /contacto...) en el
#     NAVEGADOR. Si el usuario recarga en /proyectos, nginx buscaría un fichero
#     "proyectos" que no existe → 404. La solución: devolver siempre
#     index.html y dejar que Angular decida (catch-all con try_files).
#
#  2. GZIP: servir JavaScript comprimido reduce la descarga ~70% (1.4MB →
#     ~350KB). nginx lo hace en tiempo real con poca CPU.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # GZIP: comprime textos (JS/CSS/HTML/JSON). No comprime imágenes
    # (jpeg/png ya están comprimidas: re-comprimir solo gasta CPU).
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;                       # añade "Vary: Accept-Encoding"
    gzip_min_length 1024;               # no merece la pena comprimir < 1KB
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # ------------------------------------------------------------------
    # CACHÉ para los ficheros CON HASH (main-ABC123.js):
    # el nombre cambia cuando cambia el contenido, así que podemos decir
    # "cachea esto 1 AÑO sin comprobar" → el navegador no vuelve a bajarlo.
    # (los ficheros sin hash, como index.html, NO se cachean: ver abajo)
    # ------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # ^ "immutable": el navegador ni siquiera pregunta al servidor
    }

    # index.html NUNCA en caché: es el "manifest" que referencia los hashes.
    # Si se cachease, el usuario vería una versión vieja tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------------
    # SPA FALLBACK:
    #   - Si existe el fichero real → lo sirve
    #   - Si no → sirve index.html (y Angular resuelve la ruta por su cuenta)
    # try_files con $uri /index.html = la última opción es index.html
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
