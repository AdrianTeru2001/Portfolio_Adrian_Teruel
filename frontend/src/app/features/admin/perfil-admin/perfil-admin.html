<!--
  EDICIÓN DEL PERFIL
  Un único formulario que rellena/actualiza el perfil personal (PUT).
-->
<section class="admin-page">
  <h1>Perfil personal</h1>
  <p class="admin-page__sub">
    Estos datos se muestran en la web pública (inicio, contacto, footer).
  </p>

  <!-- Mensaje feedback -->
  @if (mensaje(); as m) {
    <p [class]="'aviso aviso--' + m.tipo" role="status">{{ m.texto }}</p>
  }

  <!-- Formulario -->
  <div class="formulario">
    <div class="grid2">
      <div class="campo">
        <label for="nombre">Nombre *</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          required
          maxlength="100"
          [ngModel]="form().nombre"
          (ngModelChange)="cambiarCampo('nombre', $event)"
          placeholder="Tu nombre" />
      </div>

      <div class="campo">
        <label for="tituloProfesional">Título profesional</label>
        <input
          id="tituloProfesional"
          name="tituloProfesional"
          type="text"
          maxlength="150"
          [ngModel]="form().tituloProfesional"
          (ngModelChange)="cambiarCampo('tituloProfesional', $event)"
          placeholder="Desarrollador Full Stack" />
      </div>
    </div>

    <div class="campo">
      <label for="bio">Biografía</label>
      <textarea
        id="bio"
        name="bio"
        rows="4"
        maxlength="2000"
        [ngModel]="form().bio"
        (ngModelChange)="cambiarCampo('bio', $event)"
        placeholder="Cuéntate brevemente…"></textarea>
    </div>

    <div class="grid2">
      <div class="campo">
        <label for="email">Email *</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          [ngModel]="form().email"
          (ngModelChange)="cambiarCampo('email', $event)"
          placeholder="tu@email.com" />
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          maxlength="30"
          [ngModel]="form().telefono"
          (ngModelChange)="cambiarCampo('telefono', $event)"
          placeholder="+34 600 000 000" />
      </div>
    </div>

    <div class="grid2">
      <div class="campo">
        <label for="linkedinUrl">LinkedIn</label>
        <input
          id="linkedinUrl"
          name="linkedinUrl"
          type="url"
          maxlength="300"
          [ngModel]="form().linkedinUrl"
          (ngModelChange)="cambiarCampo('linkedinUrl', $event)"
          placeholder="https://linkedin.com/in/..." />
      </div>

      <div class="campo">
        <label for="githubUrl">GitHub</label>
        <input
          id="githubUrl"
          name="githubUrl"
          type="url"
          maxlength="300"
          [ngModel]="form().githubUrl"
          (ngModelChange)="cambiarCampo('githubUrl', $event)"
          placeholder="https://github.com/..." />
      </div>
    </div>

    <div class="grid2">
      <div class="campo">
        <label for="ubicacion">Ubicación</label>
        <input
          id="ubicacion"
          name="ubicacion"
          type="text"
          maxlength="100"
          [ngModel]="form().ubicacion"
          (ngModelChange)="cambiarCampo('ubicacion', $event)"
          placeholder="Ciudad, País" />
      </div>

      <div class="campo">
        <label for="fotoUrl">URL de la foto</label>
        <input
          id="fotoUrl"
          name="fotoUrl"
          type="url"
          maxlength="500"
          [ngModel]="form().fotoUrl"
          (ngModelChange)="cambiarCampo('fotoUrl', $event)"
          placeholder="https://..." />
      </div>
    </div>

    <div class="formulario__acciones">
      <button
        type="button"
        class="btn btn--primario"
        [disabled]="estado() === 'guardando'"
        (click)="guardar()">
        @if (estado() === 'guardando') {
          Guardando…
        } @else {
          Guardar cambios
        }
      </button>
    </div>
  </div>
</section>
