<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <!-- viewport: obligatorio para responsive (sin él, el móvil "hace zoom out") -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ======================================================================
       SEO BÁSICO (los recruiters buscan por nombre)
       ====================================================================== -->
  <title>Adrián Teruel — Desarrollador Full Stack Java / Angular</title>
  <meta name="description"
        content="Portfolio personal de Adrián Teruel Reina: proyectos, trayectoria académica y profesional, competencias en Java, Spring Boot y Angular.">
  <!-- canonical = URL canónica; evita contenido duplicado si el sitio
       responde en varias URLs (PortfolioAdrian.com/ y /index.html) -->
  <link rel="canonical" href="https://PortfolioAdrian.com/">

  <!-- Open Graph: lo que se pinta al compartir en LinkedIn/WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://PortfolioAdrian.com/">
  <meta property="og:title" content="Adrián Teruel — Desarrollador Full Stack">
  <meta property="og:description" content="Portfolio, proyectos y trayectoria profesional.">
  <meta property="og:locale" content="es_ES">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">

  <!--
    theme-color pinta la barra del navegador en móvil (Android/Chrome)
    con el color de la marca.
  -->
  <meta name="theme-color" content="#0f172a">

  <!--
    JSON-LD (Schema.org) — "SEO estructurado".
    Es un bloque de datos que le dice a Google QUÉ eres (Persona, tu nombre,
    tu ocupación, tus enlaces) de forma explícita, en vez de tener que
    "adivinarlo" rastreando el HTML. Puede desencadenar la "ficha de
    persona" en los resultados de búsqueda.
    Documentación: https://schema.org/Person
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Adrián Teruel Reina",
    "jobTitle": "Desarrollador Full Stack",
    "url": "https://PortfolioAdrian.com",
    "email": "mailto:adrianteru2001@gmail.com",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "ES"
    },
    "sameAs": [
      "https://www.linkedin.com/in/adri%C3%A1n-teruel-reina-43841b1b9/",
      "https://github.com/AdrianTeru2001"
    ]
  }
  </script>

  <base href="/">
  <!--
    Favicons: los navegadores modernos usan el SVG (nítido en Retina,
    ~1 KB); el .ico queda como respaldo para navegadores antiguos.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
</head>
<!--
  lang="es": el idioma REAL del contenido → lo usan lectores de pantalla
  y Google para clasificar el sitio. Antes decía "en" (era el default
  del CLI).
-->
<body>
  <app-root></app-root>
  <!--
    Fallback si JavaScript no carga: Angular es una SPA, sin JS no pinta
    nada. Este mensaje evita una pantalla completamente en blanco.
  -->
  <noscript>
    Este portfolio requiere JavaScript. Actívalo en tu navegador para verlo.
  </noscript>
</body>
</html>
